name: AURORA STRIKE graphical runtime capture

on:
  push:
    branches: [aurora-strike-current]
    paths:
      - 'aurora-strike/**'
      - '.github/workflows/AURORA_STRIKE_CAPTURE.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install display and Blender tools
        run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg xdotool blender python3-numpy zip libegl1 libgl1-mesa-dri libx11-6 libxi6 libxrender1 libxfixes3 libxkbcommon0
      - name: Generate island geometry with Blender
        working-directory: aurora-strike
        run: |
          set -euo pipefail
          rm -rf /tmp/aurora-strike-generated
          set -o pipefail
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.5 AURORA_OUTPUT_DIR=/tmp/aurora-strike-generated PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python tools/blender/aurora_map_gen.py 2>&1 | tee /tmp/aurora-blender.log
          mkdir -p world/generated_blender
          cp /tmp/aurora-strike-generated/AURORA_STRIKE_Master_Preview.glb world/generated_blender/AURORA_STRIKE_Master_Preview.glb
          test -s world/generated_blender/AURORA_STRIKE_Master_Preview.glb
          mkdir -p textures/biomes
          cp -a /tmp/aurora-strike-generated/textures/. textures/biomes/
          find textures/biomes -maxdepth 2 -type f -name "*.png" -print
      - name: Set up .NET 8 SDK for Godotite
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Godot 4.5.1 .NET editor
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: true
      - name: Install and compile Godotite into the runtime project
        working-directory: aurora-strike
        run: |
          set -euo pipefail
          bash tools/install_godotite.sh
          # Build the add-on project directly; creating a solution is unnecessary and SDK-version sensitive.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project.godot")
          text = p.read_text(encoding="utf-8")
          section = '[editor_plugins]'
          plugin_line = 'enabled=PackedStringArray("res://addons/godotite/plugin.cfg")'
          if "[editor_plugins]" in text:
              prefix, rest = text.split("[editor_plugins]", 1)
              split_at = rest.find("\n[")
              if split_at >= 0:
                  text = prefix + section + "\n" + plugin_line + "\n\n" + rest[split_at+1:]
              else:
                  text = prefix + section + "\n" + plugin_line + "\n"
          else:
              text = text.rstrip() + "\n\n" + section + "\n" + plugin_line + "\n"
          p.write_text(text, encoding="utf-8")
          PY
          dotnet build Godotite.csproj --configuration Release --nologo
      - name: Import Blender GLB and build Godotite LODs
        working-directory: aurora-strike
        env:
          DOTNET_GCConserveMemory: '9'
        run: |
          set -euo pipefail
          # First import writes Godot's sidecar metadata; the plugin exposes its LOD option there.
          godot --headless --editor --build-solutions --path . --quit 2>&1 | tee /tmp/aurora-godot-import-first.log
          IMPORT_FILE="world/generated_blender/AURORA_STRIKE_Master_Preview.glb.import"
          test -s "$IMPORT_FILE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("world/generated_blender/AURORA_STRIKE_Master_Preview.glb.import")
          text = p.read_text(encoding="utf-8")
          if "godotite/build_lod" not in text:
              raise SystemExit("Godotite import option missing: plugin did not register on the GLB")
          updated, n = re.subn(r'godotite/build_lod\s*=\s*false', 'godotite/build_lod=true', text)
          if n == 0 and not re.search(r'godotite/build_lod\s*=\s*true', text):
              raise SystemExit("Could not enable Godotite LOD import option")
          p.write_text(updated, encoding="utf-8")
          print("Godotite LOD enabled for the generated master GLB")
          PY
          godot --headless --editor --build-solutions --path . --quit 2>&1 | tee /tmp/aurora-godotite-lod-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' /tmp/aurora-godot-import-first.log /tmp/aurora-godotite-lod-import.log; then exit 1; fi
          grep -E 'Godotite|godotite' /tmp/aurora-godotite-lod-import.log | tail -n 20 || true
      - name: Configure square viewport for full-map screenshots
        working-directory: aurora-strike
        run: sed -i 's|window/size/viewport_height=720|window/size/viewport_height=1280|' project.godot
      - name: Capture five viewpoints from the same running game
        working-directory: aurora-strike
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/aurora-runtime
          Xvfb :99 -screen 0 1280x1280x24 -ac +extension GLX > ../artifacts/aurora-runtime/xvfb.log 2>&1 &
          XVFB_PID=$!
          echo $XVFB_PID > ../artifacts/aurora-runtime/xvfb.pid
          export DISPLAY=:99
          # Wait for X11 to accept clients before launching Godot (avoids a transient startup race).
          DISPLAY=:99 xdotool getdisplaygeometry >/dev/null 2>&1 || true
          for ATTEMPT in $(seq 1 20); do
            if DISPLAY=:99 xdotool getdisplaygeometry >/dev/null 2>&1; then break; fi
            sleep 1
          done
          DISPLAY=:99 xdotool getdisplaygeometry
          AURORA_CAPTURE=1 godot --path . --windowed --resolution 1280x1280 --position 0,0 --single-window --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy -- --view=top > ../artifacts/aurora-runtime/godot-runtime.log 2>&1 &
          GAME_PID=$!
          cleanup() {
            kill "$GAME_PID" 2>/dev/null || true
            wait "$GAME_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for ATTEMPT in $(seq 1 60); do
            if grep -q 'AURORA_RUNTIME_READY' ../artifacts/aurora-runtime/godot-runtime.log; then READY=1; break; fi
            if ! kill -0 "$GAME_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then cat ../artifacts/aurora-runtime/godot-runtime.log; exit 1; fi
          grep -q 'AURORA_MAP_SOURCE | res://world/generated_blender/AURORA_STRIKE_Master_Preview.glb' ../artifacts/aurora-runtime/godot-runtime.log
          grep -q 'AURORA_COLLISION | bridge deck generated: River_Bridge_00' ../artifacts/aurora-runtime/godot-runtime.log
          grep -q 'AURORA_COLLISION | bridge deck generated: River_Bridge_01' ../artifacts/aurora-runtime/godot-runtime.log
          WINDOW_ID=$(xdotool search --onlyvisible --name 'AURORA STRIKE' 2>/dev/null | head -n 1 || true)
          if [ -n "$WINDOW_ID" ]; then xdotool windowfocus "$WINDOW_ID" 2>/dev/null || true; fi
          # _ready logs before the first complete rendered frame on software GL.
          sleep 8
          capture_view() {
            local view="$1"
            ffmpeg -y -loglevel error -f x11grab -video_size 1280x1280 -i :99.0 -frames:v 1 -update 1 "../artifacts/aurora-runtime/aurora-$view.png"
            test -s "../artifacts/aurora-runtime/aurora-$view.png"
            test "$(stat -c%s "../artifacts/aurora-runtime/aurora-$view.png")" -gt 25000
            echo "Captured $view: $(stat -c%s "../artifacts/aurora-runtime/aurora-$view.png") bytes"
          }
          capture_view top
          for spec in "2 player" "3 station" "4 industrial" "5 coast" "6 downtown" "7 snow"; do
            read -r key view <<< "$spec"
            xdotool key --clearmodifiers "$key"
            sleep 1
            if ! grep -q "AURORA_VIEW | $view" ../artifacts/aurora-runtime/godot-runtime.log; then
              xdotool key --clearmodifiers "$key"
              sleep 2
            fi
            if ! grep -q "AURORA_VIEW | $view" ../artifacts/aurora-runtime/godot-runtime.log; then
              echo "Camera switch did not reach requested view: $view"
              cat ../artifacts/aurora-runtime/godot-runtime.log
              exit 1
            fi
            sleep 2
            capture_view "$view"
          done
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:' ../artifacts/aurora-runtime/godot-runtime.log; then
            cat ../artifacts/aurora-runtime/godot-runtime.log
            exit 1
          fi
      - name: Upload actual runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-strike-runtime-seven-views
          path: artifacts/aurora-runtime/
          retention-days: 14
      - name: Package complete project, generated Blender assets and runtime evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aurora-strike-project-bundle
          mkdir -p /tmp/aurora-strike-project-bundle
          cp -a aurora-strike /tmp/aurora-strike-project-bundle/aurora-strike
          rm -rf /tmp/aurora-strike-project-bundle/aurora-strike/.godot
          if [ -d /tmp/aurora-strike-generated ]; then
            cp -a /tmp/aurora-strike-generated /tmp/aurora-strike-project-bundle/generated-blender-output
          fi
          if [ -d artifacts/aurora-runtime ]; then
            cp -a artifacts/aurora-runtime /tmp/aurora-strike-project-bundle/runtime-evidence
          fi
          mkdir -p artifacts
          (cd /tmp/aurora-strike-project-bundle && zip -qr "$GITHUB_WORKSPACE/artifacts/aurora-strike-project-bundle.zip" .)
          test -s artifacts/aurora-strike-project-bundle.zip
          echo "Project bundle size: $(stat -c%s artifacts/aurora-strike-project-bundle.zip) bytes"
      - name: Upload complete project ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-strike-project-bundle
          path: artifacts/aurora-strike-project-bundle.zip
          retention-days: 14
