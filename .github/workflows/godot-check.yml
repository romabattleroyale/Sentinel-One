name: Godot project check
on:
  push:
    paths:
      - 'dal-paese-alla-serie-a/**'
      - '.github/workflows/godot-check.yml'
  pull_request:
    paths:
      - 'dal-paese-alla-serie-a/**'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare diagnostics and download Godot
        run: |
          mkdir -p /tmp/godot-visual-check
          sudo apt-get update
          sudo apt-get install -y wget unzip xvfb xauth imagemagick xdotool
          GODOT_VERSION="4.7.2"
          wget -q "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64
          /tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64 --version | tee /tmp/godot-visual-check/godot-version.txt
      - name: Import and parse project
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path dal-paese-alla-serie-a --quit 2>&1 | tee /tmp/godot-visual-check/import.log
      - name: Run game and capture actual window
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" bash -lc '
            set -e
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path "$GITHUB_WORKSPACE/dal-paese-alla-serie-a" --rendering-driver opengl3 --verbose > /tmp/godot-visual-check/godot.log 2>&1 &
            GODOT_PID=$!
            trap "kill $GODOT_PID 2>/dev/null || true; wait $GODOT_PID 2>/dev/null || true" EXIT
            GODOT_WINDOW=""
            for attempt in $(seq 1 45); do
              for candidate in $(xdotool search --onlyvisible 2>/dev/null || true); do
                WINDOW_NAME=$(xdotool getwindowname "$candidate" 2>/dev/null || true)
                WINDOW_CLASS=$(xprop -id "$candidate" WM_CLASS 2>/dev/null || true)
                if echo "$WINDOW_NAME $WINDOW_CLASS" | grep -Eqi "Dal Paese alla Serie A|Godot"; then
                  GODOT_WINDOW="$candidate"
                  break
                fi
              done
              if [ -n "$GODOT_WINDOW" ]; then break; fi
              if ! kill -0 "$GODOT_PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ -z "$GODOT_WINDOW" ]; then
              echo "ERROR: game window not found after 45 seconds"
              cat /tmp/godot-visual-check/godot.log
              exit 1
            fi
            xdotool windowraise "$GODOT_WINDOW" 2>/dev/null || true
            sleep 8
            import -window "$GODOT_WINDOW" /tmp/godot-visual-check/startup.png
            xdotool mousemove --window "$GODOT_WINDOW" 330 430 click 1 || true
            sleep 3
            import -window "$GODOT_WINDOW" /tmp/godot-visual-check/after-click.png
            identify /tmp/godot-visual-check/startup.png /tmp/godot-visual-check/after-click.png | tee /tmp/godot-visual-check/image-info.txt
            test -s /tmp/godot-visual-check/startup.png
            test -s /tmp/godot-visual-check/after-click.png
          '
          cat /tmp/godot-visual-check/godot.log
      - name: Run headless startup smoke test
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path dal-paese-alla-serie-a --quit-after 3 2>&1 | tee /tmp/godot-visual-check/smoke.log
      - name: Upload diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-visual-check
          path: /tmp/godot-visual-check/
          if-no-files-found: error
