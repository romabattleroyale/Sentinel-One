name: Godot project check
on:
  push:
    paths:
      - 'dal-paese-alla-serie-a/**'
      - '.github/workflows/godot-check.yml'
  pull_request:
    paths:
      - 'dal-paese-alla-serie-a/**'
      - '.github/workflows/godot-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot headless
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          GODOT_VERSION="4.7.2"
          wget -q "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import and parse project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path dal-paese-alla-serie-a --quit
