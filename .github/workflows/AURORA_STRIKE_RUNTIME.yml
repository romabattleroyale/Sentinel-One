name: AURORA STRIKE runtime check

on:
  push:
    branches: [aurora-strike-current]
    paths:
      - 'aurora-strike/**'
      - '.github/workflows/AURORA_STRIKE_RUNTIME.yml'
  workflow_dispatch:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aurora-strike
    steps:
      - name: Checkout current project branch
        uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
      - name: Verify editor import and script parsing
        run: godot --headless --editor --path . --quit
      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 5
