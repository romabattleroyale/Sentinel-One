name: AURORA STRIKE — Godot runtime diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "aurora-strike/**"
      - ".github/workflows/aurora-strike-godot.yml"

permissions:
  contents: read

jobs:
  validate-and-capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files are present
        shell: bash
        run: |
          if [ ! -f "aurora-strike/project.godot" ]; then
            echo "::error::Missing aurora-strike/project.godot. Upload the Godot project to this path first."
            exit 1
          fi

      - name: Install graphical capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot_*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import and parse project
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path aurora-strike --editor --import --quit 2>&1 | tee godot-import.log
          "$GODOT_BIN" --headless --path aurora-strike --editor --quit 2>&1 | tee godot-editor-check.log

      - name: Capture actual graphical runtime
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build
          Xvfb :99 -screen 0 1280x720x24 -ac >xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ffmpeg -y -f x11grab -video_size 1280x720 -framerate 10 -i :99.0 \
            -frames:v 1 build/aurora-strike-runtime.png >ffmpeg-capture.log 2>&1 &
          CAPTURE_PID=$!
          "$GODOT_BIN" --path aurora-strike --resolution 1280x720 --verbose --quit-after 120 \
            >godot-runtime.log 2>&1 &
          GODOT_PID=$!
          wait "$CAPTURE_PID" || true
          kill "$GODOT_PID" 2>/dev/null || true
          wait "$GODOT_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          test -s build/aurora-strike-runtime.png || {
            echo "::error::Runtime screenshot was not produced; inspect Godot and capture logs."
            exit 1
          }

      - name: Prepare diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build
          cp -f godot-*.log xvfb.log ffmpeg-capture.log build/ 2>/dev/null || true
          if [ -d aurora-strike ]; then
            tar --exclude='.godot' --exclude='build' -czf build/aurora-strike-source.tar.gz aurora-strike || true
          fi

      - name: Upload runtime screenshot, source and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-strike-runtime-and-diagnostics
          path: build/
          if-no-files-found: warn
          retention-days: 14
